<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecaFlow - Mark Lee</title>
    
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="./favicon.png" type="image/png">
    
    <!-- 모던하고 단정한 영문 폰트 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111111;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeInOnly 1.2s ease-out forwards;
        }
        
        .logo-container {
            max-width: 690px;
            width: 90%;
            margin-bottom: 36px;
        }

        .logo-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .name {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #0f172a;
            margin: 0 0 8px 0;
        }

        .title {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #64748b;
            text-transform: uppercase;
            margin: 0 0 12px 0;
        }

        .email-link {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #2563eb;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .email-link:hover {
            color: #1d4ed8;
            background-color: #f1f5f9;
            text-decoration: underline;
        }

        @keyframes fadeInOnly {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 50% 확대 로고 -->
        <div class="logo-container">
            <img src="./logo.png?v=6" alt="DecaFlow Logo" class="logo-image">
        </div>

        <!-- 하단 정보 블록 -->
        <div class="profile-card">
            <h1 class="name">Mark Lee</h1>
            <p class="title">IT SUPPORT & SERVER ENGINEER</p>
            <a href="mailto:mark.lee@decaflow.co.kr" class="email-link">mark.lee@decaflow.co.kr</a>
        </div>
    </div>

</body>
</html>
